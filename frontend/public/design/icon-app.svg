<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>SunuPrix — Icône Application Mobile 3D</title>
  <defs>
    <linearGradient id="goldGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CD" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <radialGradient id="creamBgA" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FBF9F4" />
      <stop offset="70%" stop-color="#F3ECE0" />
      <stop offset="100%" stop-color="#E5DAC9" />
    </radialGradient>
    <linearGradient id="emeraldGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#115A46" />
      <stop offset="100%" stop-color="#073327" />
    </linearGradient>
    <pattern id="arrowPatternA" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <rect width="30" height="30" fill="#073327" />
      <path d="M0 15 L15 0 L30 15 L15 30 Z" fill="none" stroke="#E5C158" stroke-width="2" />
      <circle cx="15" cy="15" r="2.5" fill="#E5C158" />
    </pattern>
    <filter id="shadowA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fond vert foncé arrondi -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#072A20" />

  <g transform="translate(256,256) scale(0.85) translate(-256,-256)" filter="url(#shadowA)">
    <circle cx="256" cy="256" r="248" fill="#062920" />
    <circle cx="256" cy="256" r="244" fill="none" stroke="url(#goldGradA)" stroke-width="14" />
    <circle cx="256" cy="256" r="226" fill="url(#creamBgA)" />

    <!-- Baobab -->
    <path d="M 204 390 C 212 330, 222 280, 234 220 L 278 220 C 290 280, 300 330, 308 390 Z" fill="url(#emeraldGradA)" stroke="url(#goldGradA)" stroke-width="4.5" />
    <polygon points="256,40 310,50 360,82 390,130 394,185 365,225 315,245 256,252 197,245 147,225 118,185 122,130 152,82 202,50" fill="url(#emeraldGradA)" stroke="url(#goldGradA)" stroke-width="4.5" />
    
    <g fill="none" stroke="url(#goldGradA)" stroke-width="2.5">
      <line x1="256" y1="40" x2="256" y2="115" />
      <line x1="310" y1="50" x2="256" y2="115" />
      <line x1="360" y1="82" x2="256" y2="115" />
      <line x1="202" y1="50" x2="256" y2="115" />
      <line x1="152" y1="82" x2="256" y2="115" />
      <line x1="256" y1="115" x2="325" y2="135" />
      <line x1="256" y1="115" x2="187" y2="135" />
      <line x1="256" y1="115" x2="256" y2="195" />
      <line x1="390" y1="130" x2="325" y2="135" />
      <line x1="118" y1="130" x2="187" y2="135" />
    </g>

    <!-- Arrow -->
    <path d="M 70 380 Q 140 430, 200 370 T 320 310 L 395 240 L 410 300 L 420 200 L 320 215 L 365 248 L 295 310 Q 220 375, 175 355 Q 125 330, 70 380 Z" 
          fill="url(#arrowPatternA)" stroke="url(#goldGradA)" stroke-width="6" />
  </g>
</svg>

