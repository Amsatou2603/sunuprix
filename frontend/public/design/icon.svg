<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>SunuPrix — Logo Officiel 3D (Baobab &amp; Flèche de Croissance Dorée)</title>
  <defs>
    <!-- Dégradé métallique or -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CD" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Dégradé métallique or sombre pour ombres 3D -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#5C4008" />
    </linearGradient>

    <!-- Fond parchemin crème -->
    <radialGradient id="creamBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FBF9F4" />
      <stop offset="70%" stop-color="#F3ECE0" />
      <stop offset="100%" stop-color="#E5DAC9" />
    </radialGradient>

    <!-- Vert Émeraude Baobab -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#115A46" />
      <stop offset="100%" stop-color="#073327" />
    </linearGradient>

    <!-- Motif géométrique tribal/chevron pour l'intérieur de la flèche -->
    <pattern id="arrowPattern" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <rect width="30" height="30" fill="#073327" />
      <path d="M0 15 L15 0 L30 15 L15 30 Z" fill="none" stroke="#E5C158" stroke-width="2" />
      <path d="M7.5 15 L15 7.5 L22.5 15 L15 22.5 Z" fill="none" stroke="#F5D886" stroke-width="1.2" opacity="0.8" />
      <circle cx="15" cy="15" r="2.5" fill="#E5C158" />
      <line x1="0" y1="0" x2="30" y2="30" stroke="#E5C158" stroke-width="1" opacity="0.5" />
      <line x1="30" y1="0" x2="0" y2="30" stroke="#E5C158" stroke-width="1" opacity="0.5" />
    </pattern>

    <!-- Ombre portée douce -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="4" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.25" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Groupe principal avec filtre -->
  <g filter="url(#shadow3d)">
    <!-- Anneau extérieur vert foncé -->
    <circle cx="256" cy="256" r="248" fill="#062920" />

    <!-- Anneau métallique or 3D biseauté -->
    <circle cx="256" cy="256" r="244" fill="none" stroke="url(#goldGrad)" stroke-width="14" />
    <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldDark)" stroke-width="3" opacity="0.7" />
    <circle cx="256" cy="256" r="230" fill="none" stroke="#FFF3CD" stroke-width="2" opacity="0.9" />

    <!-- Cercle intérieur fond parchemin -->
    <circle cx="256" cy="256" r="226" fill="url(#creamBg)" filter="url(#innerShadow)" />
    <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6" />

    <!-- ==================== ARBRE BAOBAB LOW-POLY ==================== -->
    <g id="baobab">
      <!-- Tronc de baobab évasé à la base -->
      <path d="M 204 390 
               C 212 330, 222 280, 234 220 
               L 278 220 
               C 290 280, 300 330, 308 390 
               Z" 
            fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round" />

      <!-- Nervures / Facettes du tronc -->
      <line x1="256" y1="220" x2="256" y2="390" stroke="url(#goldGrad)" stroke-width="2.5" />
      <line x1="240" y1="230" x2="228" y2="390" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.8" />
      <line x1="272" y1="230" x2="284" y2="390" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.8" />

      <!-- Facettes sombres tronc -->
      <path d="M 234 220 L 256 220 L 256 390 L 228 390 Z" fill="#041E17" opacity="0.35" />
      
      <!-- Crown / Canopée basse-poly (Couronne de baobab géométrique) -->
      <polygon points="256,40 310,50 360,82 390,130 394,185 365,225 315,245 256,252 197,245 147,225 118,185 122,130 152,82 202,50" 
               fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round" />

      <!-- Réseau de facettes géométriques (Lignes de structure or) -->
      <g fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Pôle central haut -->
        <line x1="256" y1="40" x2="256" y2="115" />
        <line x1="310" y1="50" x2="256" y2="115" />
        <line x1="360" y1="82" x2="256" y2="115" />
        <line x1="202" y1="50" x2="256" y2="115" />
        <line x1="152" y1="82" x2="256" y2="115" />

        <!-- Lignes horizontales inter-facettes -->
        <line x1="256" y1="115" x2="325" y2="135" />
        <line x1="256" y1="115" x2="187" y2="135" />
        <line x1="256" y1="115" x2="256" y2="195" />

        <!-- Pôle droit -->
        <line x1="360" y1="82" x2="325" y2="135" />
        <line x1="390" y1="130" x2="325" y2="135" />
        <line x1="394" y1="185" x2="325" y2="135" />
        <line x1="365" y1="225" x2="325" y2="135" />
        <line x1="315" y1="245" x2="256" y2="195" />
        <line x1="325" y1="135" x2="256" y2="195" />

        <!-- Pôle gauche -->
        <line x1="152" y1="82" x2="187" y2="135" />
        <line x1="118" y1="130" x2="187" y2="135" />
        <line x1="122" y1="185" x2="187" y2="135" />
        <line x1="147" y1="225" x2="187" y2="135" />
        <line x1="197" y1="245" x2="256" y2="195" />
        <line x1="187" y1="135" x2="256" y2="195" />

        <!-- Base du feuillage -->
        <line x1="256" y1="195" x2="256" y2="252" />
        <line x1="197" y1="245" x2="256" y2="252" />
        <line x1="315" y1="245" x2="256" y2="252" />
      </g>

      <!-- Shading facettes (Ombrages bas-poly) -->
      <g stroke="none">
        <polygon points="256,40 310,50 256,115" fill="#FFF3CD" opacity="0.2" />
        <polygon points="360,82 390,130 325,135" fill="#FFF3CD" opacity="0.15" />
        <polygon points="118,130 122,185 187,135" fill="#02140F" opacity="0.4" />
        <polygon points="147,225 197,245 187,135" fill="#02140F" opacity="0.45" />
        <polygon points="197,245 256,252 256,195 187,135" fill="#02140F" opacity="0.35" />
        <polygon points="365,225 315,245 256,195 325,135" fill="#FFF3CD" opacity="0.1" />
      </g>
    </g>

    <!-- ==================== FLÈCHE / COURBE DE CROISSANCE DORÉE ==================== -->
    <g id="growthArrow" filter="url(#shadow3d)">
      <!-- Tracé principal de la flèche avec motif tribal & bordure or -->
      <!-- Forme globale de la courbe boursière montante avec pointe d'envol à droite -->
      <path d="M 70 380 
               Q 140 430, 200 370 
               T 320 310 
               L 395 240 
               L 410 300 
               L 420 200 
               L 320 215 
               L 365 248 
               L 295 310 
               Q 220 375, 175 355 
               Q 125 330, 70 380 
               Z" 
            fill="url(#arrowPattern)" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />

      <!-- Contour biseauté or 3D supérieur -->
      <path d="M 70 380 Q 140 430, 200 370 T 320 310 L 395 240 L 420 200 L 320 215 L 365 248 L 295 310 Q 220 375, 175 355 Q 125 330, 70 380 Z" 
            fill="none" stroke="#FFF3CD" stroke-width="2" opacity="0.8" />

      <!-- Chevron d'accentuation métallique sur la tête de flèche -->
      <polygon points="420,200 380,240 395,245 408,215" fill="url(#goldGrad)" />
    </g>
  </g>
</svg>

