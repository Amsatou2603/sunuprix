      <g fill="none" stroke="#EF9F27" stroke-width="1.5" opacity="0.85">
        <line x1="256" y1="120" x2="256" y2="64" />
        <line x1="256" y1="120" x2="300" y2="72" />
        <line x1="256" y1="120" x2="338" y2="98" />
        <line x1="256" y1="120" x2="212" y2="72" />
        <line x1="256" y1="120" x2="174" y2="98" />
        <line x1="256" y1="120" x2="256" y2="196" />
        <line x1="312" y1="182" x2="338" y2="98" />
        <line x1="312" y1="182" x2="362" y2="140" />
        <line x1="312" y1="182" x2="366" y2="184" />
        <line x1="312" y1="182" x2="344" y2="218" />
        <line x1="312" y1="182" x2="300" y2="236" />
        <line x1="312" y1="182" x2="256" y2="196" />
        <line x1="200" y1="182" x2="174" y2="98" />
        <line x1="200" y1="182" x2="146" y2="140" />
        <line x1="200" y1="182" x2="150" y2="184" />
        <line x1="200" y1="182" x2="168" y2="218" />
        <line x1="200" y1="182" x2="212" y2="236" />
        <line x1="200" y1="182" x2="256" y2="196" />
        <line x1="256" y1="196" x2="256" y2="242" />
        <line x1="212" y1="236" x2="256" y2="242" />
        <line x1="300" y1="236" x2="256" y2="242" />
