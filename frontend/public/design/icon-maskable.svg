<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>SunuPrix — icône maskable (PWA Android)</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FBF9F3" />
      <stop offset="100%" stop-color="#EFE8D6" />
    </radialGradient>
  </defs>

  <!-- Carte arrondie vert très foncé (fond d'icône mobile) -->
  <rect x="0" y="0" width="512" height="512" fill="#0B2E24" />

  <g transform="translate(256,256) scale(0.72) translate(-256,-256)">
    <!-- Anneau extérieur doré -->
    <circle cx="256" cy="256" r="246" fill="#0B4A3B" />
    <circle cx="256" cy="256" r="246" fill="none" stroke="#EF9F27" stroke-width="10" />
    <circle cx="256" cy="256" r="228" fill="none" stroke="#F7D48A" stroke-width="2" opacity="0.6" />

    <!-- Fond vert foncé du badge -->
    <circle cx="256" cy="256" r="222" fill="#0F6E56" />

    <!-- Halo crème derrière l'arbre -->
    <circle cx="256" cy="222" r="168" fill="url(#halo)" />
    <circle cx="256" cy="222" r="168" fill="none" stroke="#EF9F27" stroke-width="3" opacity="0.5" />

    <!-- ============ ARBRE BAS-POLY (baobab géométrique) ============ -->
    <g>
